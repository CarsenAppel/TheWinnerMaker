{% extends "base.html" %}
{% block title %}WinnerMaker - My team{% endblock %}
{% block content %}
  <h1>My team</h1>

  <form class="upload-form" method="post" action="{{ url_for('team_upload') }}">
    <label>Roster (one player per line)
      <textarea name="roster_text" rows="10" placeholder="Patrick Mahomes
Travis Kelce
Tyreek Hill">{{ roster_text }}</textarea>
    </label>
    <button type="submit" class="primary">Save roster</button>
  </form>

  {% if not players %}
    <div class="notice info">No team uploaded yet.</div>
  {% else %}
    <div class="table-responsive stack-table">
    <table>
      <thead>
        <tr><th>Player</th></tr>
      </thead>
      <tbody>
        {% for name in players %}
          <tr><td data-label="Player">{{ name }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    </div>
  {% endif %}
{% endblock %}
